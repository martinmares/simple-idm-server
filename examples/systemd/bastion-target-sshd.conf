# Example /etc/ssh/sshd_config.d/60-simple-idm-bastion.conf on target Linux hosts.
# Validate the entire resulting configuration with sshd -t before reload.
PubkeyAuthentication yes
TrustedUserCAKeys /etc/ssh/simple-idm-user-ca.pub
AuthorizedPrincipalsFile /etc/ssh/simple-idm-principals/%u

# Restrict only the managed account here. Apply the policy to each managed account
# or a managed Unix group; preserve your separately reviewed recovery access.
Match User postgres
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile none
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
Match all
