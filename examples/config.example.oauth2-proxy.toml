# OAuth2 Proxy Configuration Example
# Copy this file to config.oauth2-proxy.toml and adjust values
# You can also override any setting with environment variables:
# OAUTH2_PROXY_LISTEN_ADDR=0.0.0.0:4180 cargo run --bin simple-idm-oauth2-proxy

# ---------------------------------------------------------------------------
# Variant A: nginx / ingress reverse proxy + auth_request
# ---------------------------------------------------------------------------
#
# Browser talks to nginx/ingress. Nginx proxies application traffic to the
# upstream app and calls simple-idm-oauth2-proxy only for auth decisions.
#
#   browser -> nginx/ingress -> upstream app
#                     |
#                     +-> simple-idm-oauth2-proxy /auth,/start,/callback
#
# The public OAuth2 proxy URL is mounted under the app origin as /oauth2.
# With redirect_path = "/callback", configure the OIDC client redirect URI as:
#
#   https://app.example.com/oauth2/callback
#
mode = "auth_request"  # "auth_request" or "reverse_proxy"
listen_addr = "127.0.0.1:4180"
public_base_url = "https://app.example.com/oauth2"

# ---------------------------------------------------------------------------
# Variant B: built-in reverse proxy mode, without nginx
# ---------------------------------------------------------------------------
#
# Browser talks directly to simple-idm-oauth2-proxy. The proxy performs OIDC
# login/session handling and forwards authenticated HTTP/1.1 + WebSocket traffic
# to one upstream app.
#
#   browser -> simple-idm-oauth2-proxy -> upstream app
#
# To use this mode, switch the values above to:
#
# mode = "reverse_proxy"
# listen_addr = "127.0.0.1:4180"
# public_base_url = "https://app.example.com"
# upstream_url = "http://127.0.0.1:3000"
# protected_prefixes = ["/"]
# public_prefixes = ["/healthz", "/static"]
# upstream_timeout_secs = 300
#
# Variant B is also useful behind a TLS-only nginx edge:
#
#   browser -> nginx TLS edge -> simple-idm-oauth2-proxy -> upstream app
#
# In that deployment nginx owns certificates and forwards all traffic to
# simple-idm-oauth2-proxy. Configure public_base_url to the external HTTPS
# origin, not to the local proxy address.

# Cookie settings
cookie_name = "_oauth2_proxy"
cookie_secret = "CHANGE-ME-TO-RANDOM-32-CHAR-STRING"  # Generate with: openssl rand -base64 32
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"

# Session configuration
session_max_age = 3600  # 1 hour in seconds
session_backend = "memory"  # "memory" or "sqlite"
# session_sqlite_path = "/var/lib/simple-idm-oauth2-proxy/sessions.db"  # Required if backend is "sqlite"

# OIDC Provider configuration
oidc_issuer = "http://localhost:8080"
client_id = "example-app"
client_secret = "your-client-secret-here"
redirect_path = "/callback"

# Scopes to request
scopes = ["openid", "profile", "email"]

# Claims configuration
groups_claim = "groups"  # JWT claim name containing user groups
username_claims = ["preferred_username", "email", "sub"]  # Try in order

# Header configuration
groups_header_name = "X-Auth-Groups"
groups_header_format = "csv"  # "csv" or "jsonb64"

# ---------------------------------------------------------------------------
# Example nginx configuration for Variant A
# ---------------------------------------------------------------------------
#
# server {
#     listen 80;
#     server_name app.example.com;
#
#     location / {
#         # Auth request
#         auth_request /auth;
#         auth_request_set $auth_user $upstream_http_x_auth_user;
#         auth_request_set $auth_email $upstream_http_x_auth_email;
#         auth_request_set $auth_groups $upstream_http_x_auth_groups;
#
#         # Pass auth headers to backend
#         proxy_set_header X-Auth-User $auth_user;
#         proxy_set_header X-Auth-Email $auth_email;
#         proxy_set_header X-Auth-Groups $auth_groups;
#
#         # WebSocket support
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade $http_upgrade;
#         proxy_set_header Connection $connection_upgrade;
#
#         proxy_pass http://localhost:3000;
#     }
#
#     location /auth {
#         internal;
#         proxy_pass http://localhost:4180/auth;
#         proxy_pass_request_body off;
#         proxy_set_header Content-Length "";
#         proxy_set_header X-Original-URI $request_uri;
#     }
#
#     location /oauth2 {
#         proxy_pass http://localhost:4180;
#     }
# }
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
#
# Login flow:
# 1. User accesses https://app.example.com/
# 2. Nginx makes subrequest to /auth (proxy at localhost:4180/auth)
# 3. Proxy returns 401 (no session)
# 4. User is redirected to https://app.example.com/oauth2/start?rd=/
# 5. Proxy redirects to OIDC provider (localhost:8080/oauth2/authorize)
# 6. User logs in at OIDC provider
# 7. Provider redirects back to https://app.example.com/oauth2/callback
# 8. Proxy exchanges code for tokens, creates session
# 9. User is redirected to original URL (/)
# 10. Nginx makes subrequest to /auth - now returns 200 with headers
# 11. User accesses the application with identity headers
#
# ---------------------------------------------------------------------------
# Minimal config override for Variant B
# ---------------------------------------------------------------------------
#
# mode = "reverse_proxy"
# listen_addr = "127.0.0.1:4180"
# public_base_url = "https://app.example.com"
# upstream_url = "http://127.0.0.1:3000"
# protected_prefixes = ["/"]
# public_prefixes = ["/healthz", "/static"]
#
# In this mode the browser talks directly to simple-idm-oauth2-proxy. The proxy
# performs OIDC login, validates the session cookie, strips client-supplied
# X-Auth-* headers, injects trusted X-Auth-* headers, and forwards HTTP/1.1 and
# WebSocket traffic to the configured upstream.
#
# OIDC client setup for this variant:
#
# - client type: confidential
# - grant types: authorization_code, refresh_token
# - scopes: openid, profile, email, groups
# - redirect URI: https://app.example.com/callback
#
# Logout:
#
# - app logout links should point to /logout
# - /logout clears the proxy session cookie
# - it does not necessarily clear the central SSO session at simple-idm-server
#
# Systemd example:
#
# [Unit]
# Description=Simple IDM OAuth2 proxy
# After=network-online.target
# Wants=network-online.target
#
# [Service]
# Type=simple
# User=simple-idm-oauth2-proxy
# Group=simple-idm-oauth2-proxy
# Environment=RUST_LOG=info
# Environment=OAUTH2_PROXY_CONFIG=/etc/simple-idm-oauth2-proxy/config.toml
# ExecStart=/usr/local/bin/simple-idm-oauth2-proxy
# Restart=on-failure
# RestartSec=3
# NoNewPrivileges=true
# PrivateTmp=true
# ProtectSystem=strict
# ProtectHome=true
# ReadWritePaths=/var/lib/simple-idm-oauth2-proxy
#
# [Install]
# WantedBy=multi-user.target
#
# Nginx TLS-edge example for reverse_proxy mode:
#
# upstream app_oauth2_proxy {
#     server 127.0.0.1:4180;
# }
#
