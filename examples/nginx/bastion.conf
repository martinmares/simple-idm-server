# Include inside nginx's http {} context. Substitute DNS and TLS certificate paths.
map $http_upgrade $bastion_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name bastion.example.com;
    ssl_certificate /etc/letsencrypt/live/bastion.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bastion.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:9230;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bastion_connection;
        proxy_set_header Authorization $http_authorization;
        # Replace caller-supplied forwarding headers, do not append them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Avoid request-URI access logs: credentials must never enter URLs.
        access_log off;
    }
}
