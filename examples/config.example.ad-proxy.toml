# Copy this file to /etc/simple-idm-ad-proxy/config.toml and adjust values.
#
# Run locally:
#   AD_PROXY_CONFIG=examples/config.example.ad-proxy.toml cargo run -p simple-idm-ad-proxy

listen_addr = "127.0.0.1:4181"
public_base_url = "https://internal-app.example.cz"
external_base_path = ""

cookie_name = "_simple_ad_proxy"
cookie_secret = "CHANGE_ME_TO_RANDOM_32_PLUS_CHARS"
cookie_samesite = "Lax"
session_max_age_seconds = 28800
default_redirect_path = "/"

login_title = "Sign in"
login_description = "Use your AD account to continue."

[ldap]
# service_account:
#   bind with a technical account, search user, verify password, then read roles.
# bind_as_user:
#   bind directly as the submitted user and read roles through that user session.
mode = "service_account"
host = "ad.example.cz"
port = 636
base_dn = "DC=example,DC=cz"
bind_dn = "CN=svc-auth,OU=Service Accounts,DC=example,DC=cz"
bind_password = "CHANGE_ME"
# Each value above can instead be loaded from a dedicated file. Configure
# exactly one form per value; relative paths are resolved against this TOML file.
# base_dn_file = "shared/base-dn"
# bind_dn_file = "shared/bind-dn"
# bind_password_file = "shared/bind-password"
# Used only when mode = "bind_as_user".
# Common AD examples:
#   user_bind_format = "{login}@AD.EXAMPLE"
#   user_bind_format = "AD\\{login}"
user_bind_format = "{login}"
user_filter = "(|(sAMAccountName={login})(userPrincipalName={login})(mail={login}))"
tls_mode = "ldaps"
timeout_seconds = 5
allow_insecure = false

[authz]
# If true, authenticated users are allowed only when at least one role mapping
# matches their AD memberOf values.
require_mapped_group = true

[headers]
emit_x_auth = true
# Optional compatibility aliases for software configured around
# X-WEBAUTH-* (for example Grafana without an nginx header mapping).
emit_webauth = false
groups_header_name = "X-Auth-Groups"
groups_header_format = "csv" # csv | jsonb64

[[role_mappings]]
ad_group_cn = "Icinga_Grafana_Viewer"
emit_group = "grafana_viewer"
emit_header_role = "Viewer"

[[role_mappings]]
ad_group_cn = "Grafana_Editors"
emit_group = "grafana_editor"
emit_header_role = "Editor"

[[role_mappings]]
ad_group_cn = "Grafana_Admins"
emit_group = "grafana_admin"
emit_header_role = "Admin"

[[role_mappings]]
ad_group_dn = "CN=OCP_PROD_TSM_ADMIN,OU=OCP,OU=Resources,OU=grp,DC=ad,DC=example"
emit_group = "ocp_tsm_admin"
