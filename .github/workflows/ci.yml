name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake perl make jq
      - name: Install dependency audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Run shared CI checks
        run: bash scripts/ci-check.sh
