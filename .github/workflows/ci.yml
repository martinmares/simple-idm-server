name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake perl make jq
      - name: Check shared version
        run: python3 scripts/release.py check
      - name: Test release scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --locked --workspace --all-targets
