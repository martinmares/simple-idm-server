[package]
name = "simple-idm-ctl"
version = "0.11.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "simple-idm-ctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
open = "5.4"
openidconnect = "4.0"
qrcode = "0.14"
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
simple-idm-common = { path = "../simple-idm-common" }
tabled = "0.22"
tokio = { version = "1", features = ["full"] }
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.27", features = ["v4", "serde"] }
