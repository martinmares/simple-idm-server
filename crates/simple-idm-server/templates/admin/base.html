<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple IDM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css" rel="stylesheet">
</head>
<body>
  <div class="page">
    <header class="navbar navbar-expand-md d-print-none navbar-dark">
      <div class="container-xl">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
          <a href="/admin/ui/users">
            <i class="ti ti-shield-lock me-2"></i>
            Simple IDM Admin
          </a>
        </h1>
        <div class="navbar-nav flex-row order-md-last">
          <div class="nav-item d-none d-md-flex position-relative me-2">
            <a href="#" class="nav-link px-0" id="theme-toggle" tabindex="-1" aria-label="Toggle theme">
              <i class="ti ti-sun"></i>
            </a>
            <div id="theme-menu" class="dropdown-menu dropdown-menu-end dropdown-menu-arrow" style="display:none; position:absolute; right:0; top:100%;">
              <a href="#" class="dropdown-item" data-theme="light">
                <i class="ti ti-sun me-2"></i> Light
              </a>
              <a href="#" class="dropdown-item" data-theme="dark">
                <i class="ti ti-moon me-2"></i> Dark
              </a>
              <a href="#" class="dropdown-item" data-theme="auto">
                <i class="ti ti-device-desktop me-2"></i> Auto
              </a>
            </div>
          </div>
          <form method="post" action="/admin/ui/logout" class="d-flex align-items-center">
            <button type="submit" class="btn btn-outline-danger btn-sm">
              <i class="ti ti-logout me-1"></i> Logout
            </button>
          </form>
        </div>
      </div>
    </header>

    <header class="navbar-expand-md">
      <div class="collapse navbar-collapse" id="navbar-menu">
        <div class="navbar">
          <div class="container-xl">
            <ul class="navbar-nav">
              {% for s in sections %}
              <li class="nav-item {% if s.active %}active{% endif %}">
                <a class="nav-link" href="{{ s.path }}">
                  <span class="nav-link-title">{{ s.title }}</span>
                </a>
              </li>
              {% endfor %}
            </ul>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <div class="page-body">
        <div class="container-xl">
          {% if let Some(msg) = message %}
          <div class="alert alert-success" role="alert">{{ msg }}</div>
          {% endif %}
          {% if let Some(err) = error %}
          <div class="alert alert-danger" role="alert">{{ err }}</div>
          {% endif %}
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const themeToggle = document.getElementById('theme-toggle');
      const themeMenu = document.getElementById('theme-menu');
      const themeButtons = document.querySelectorAll('[data-theme]');

      if (themeToggle && themeMenu) {
        themeToggle.addEventListener('click', function(e) {
          e.preventDefault();
          themeMenu.style.display = themeMenu.style.display === 'block' ? 'none' : 'block';
        });

        document.addEventListener('click', function(e) {
          if (!themeToggle.contains(e.target) && !themeMenu.contains(e.target)) {
            themeMenu.style.display = 'none';
          }
        });
      }

      function applyTheme(theme) {
        if (theme === 'auto') {
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-bs-theme', prefersDark ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-bs-theme', theme);
        }
      }

      themeButtons.forEach(function(button) {
        button.addEventListener('click', function(e) {
          e.preventDefault();
          const theme = this.getAttribute('data-theme') || 'auto';
          localStorage.setItem('theme', theme);
          applyTheme(theme);
          if (themeMenu) themeMenu.style.display = 'none';
        });
      });

      const savedTheme = localStorage.getItem('theme') || 'auto';
      applyTheme(savedTheme);

      if (savedTheme === 'auto') {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
          document.documentElement.setAttribute('data-bs-theme', e.matches ? 'dark' : 'light');
        });
      }
    });
  </script>
</body>
</html>
