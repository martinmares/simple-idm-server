<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple IDM Admin</title>
  <link href="/admin/ui/static/css/tabler.min.css" rel="stylesheet">
  <link href="/admin/ui/static/css/tabler-icons.min.css" rel="stylesheet">
  <style>
    html,
    body {
      max-width: 100%;
      overflow-x: hidden;
    }

    .page,
    .page-wrapper,
    .page-body,
    .container-xl,
    .row,
    .card {
      min-width: 0;
    }

    .page {
      overflow-x: clip;
    }

    code {
      overflow-wrap: anywhere;
    }

    .dashboard-card {
      border: 1px solid color-mix(in srgb, var(--tblr-border-color) 72%, transparent);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      background: color-mix(in srgb, var(--tblr-bg-surface) 92%, var(--tblr-primary) 8%);
    }

    .dashboard-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--tblr-primary) 60%, var(--tblr-border-color) 40%);
      box-shadow: 0 0.6rem 1.2rem rgba(32, 107, 196, 0.22);
    }

    .dashboard-icon {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.55rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .dashboard-kpi {
      font-size: 1.55rem;
      line-height: 1.1;
      font-weight: 700;
    }

    .dashboard-subtitle {
      font-size: 0.8rem;
      color: var(--tblr-secondary);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Modal backdrop and dialog polish (aligned with explorer apps) */
    .modal-backdrop {
      background-color: rgba(10, 18, 32, 0.46);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    .modal-backdrop.show {
      opacity: 0.62;
    }

    .modal-content {
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.46);
      border-color: color-mix(in srgb, var(--tblr-border-color) 72%, transparent);
    }
  </style>
  <script>
    (function () {
      const t = localStorage.getItem('theme') || 'auto';
      if (t === 'auto') {
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      } else {
        document.documentElement.setAttribute('data-bs-theme', t);
      }
    })();
  </script>
</head>
<body>
  <div class="page">
    <header class="navbar navbar-expand-md d-print-none navbar-dark">
      <div class="container-xl">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
          <a href="/admin/ui/users">
            <i class="ti ti-shield-lock me-2"></i>
            Simple IDM Admin
          </a>
        </h1>
        <div class="navbar-nav flex-row order-md-last">
          <div class="nav-item d-none d-md-flex position-relative me-2">
            <a href="#" class="nav-link px-0" id="theme-toggle" aria-label="Toggle theme">
              <i class="ti ti-sun" id="theme-icon"></i>
            </a>
            <div id="theme-menu" class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
              <a href="#" class="dropdown-item" data-theme="light">
                <i class="ti ti-sun me-2"></i>Light
              </a>
              <a href="#" class="dropdown-item" data-theme="dark">
                <i class="ti ti-moon me-2"></i>Dark
              </a>
              <a href="#" class="dropdown-item" data-theme="auto">
                <i class="ti ti-device-desktop me-2"></i>Auto
              </a>
            </div>
          </div>
          <form method="post" action="/admin/ui/logout" class="d-flex align-items-center">
            <button type="submit" class="btn btn-outline-danger btn-sm">
              <i class="ti ti-logout me-1"></i> Logout
            </button>
          </form>
        </div>
      </div>
    </header>

    <header class="navbar-expand-md">
      <div class="collapse navbar-collapse" id="navbar-menu">
        <div class="navbar">
          <div class="container-xl">
            <ul class="navbar-nav">
              {% for s in sections %}
              <li class="nav-item {% if s.active %}active{% endif %}">
                <a class="nav-link" href="{{ s.path }}">
                  <span class="nav-link-title">{{ s.title }}</span>
                </a>
              </li>
              {% endfor %}
            </ul>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <div class="page-body">
        <div class="container-xl">
          {% if let Some(msg) = message %}
          <div class="alert alert-success" role="alert">{{ msg }}</div>
          {% endif %}
          {% if let Some(err) = error %}
          <div class="alert alert-danger" role="alert">{{ err }}</div>
          {% endif %}
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>
  </div>

  <div class="modal modal-blur fade" id="confirm-action-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="confirm-action-title">Confirm action</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex gap-3">
            <span class="avatar avatar-md bg-red-lt text-red flex-shrink-0" id="confirm-action-icon">
              <i class="ti ti-alert-triangle"></i>
            </span>
            <div>
              <div class="fw-semibold mb-1" id="confirm-action-summary">This action needs confirmation.</div>
              <div class="text-secondary small" id="confirm-action-message">Continue?</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-action-submit">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/admin/ui/static/js/tabler.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const icons = { light: 'ti-sun', dark: 'ti-moon', auto: 'ti-device-desktop' };
      const themeToggle = document.getElementById('theme-toggle');
      const themeMenu = document.getElementById('theme-menu');
      const themeButtons = document.querySelectorAll('[data-theme]');

      if (themeToggle && themeMenu) {
        themeToggle.addEventListener('click', function(e) {
          e.preventDefault();
          themeMenu.classList.toggle('show');
        });

        document.addEventListener('click', function(e) {
          if (!themeToggle.contains(e.target) && !themeMenu.contains(e.target)) {
            themeMenu.classList.remove('show');
          }
        });
      }

      function applyTheme(theme) {
        const dark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        const icon = document.getElementById('theme-icon');
        if (icon) {
          icon.className = 'ti ' + (icons[theme] || 'ti-sun');
        }
      }

      themeButtons.forEach(function(button) {
        button.addEventListener('click', function(e) {
          e.preventDefault();
          const theme = this.getAttribute('data-theme') || 'auto';
          localStorage.setItem('theme', theme);
          applyTheme(theme);
          if (themeMenu) themeMenu.classList.remove('show');
        });
      });

      const savedTheme = localStorage.getItem('theme') || 'auto';
      applyTheme(savedTheme);

      if (savedTheme === 'auto') {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
          applyTheme('auto');
        });
      }

      let modalBackdrop = null;

      function showModal(el) {
        if (!el) return;
        if (window.bootstrap && window.bootstrap.Modal) {
          window.bootstrap.Modal.getOrCreateInstance(el).show();
          return;
        }
        hideOpenModal();
        el.classList.add('show');
        el.style.display = 'block';
        el.removeAttribute('aria-hidden');
        el.setAttribute('aria-modal', 'true');
        el.setAttribute('role', 'dialog');
        document.body.classList.add('modal-open');
        if (!modalBackdrop) {
          modalBackdrop = document.createElement('div');
          modalBackdrop.className = 'modal-backdrop fade show';
          document.body.appendChild(modalBackdrop);
          modalBackdrop.addEventListener('click', function() {
            hideModal(el);
          });
        }
      }

      function hideModal(el) {
        if (!el) return;
        if (window.bootstrap && window.bootstrap.Modal) {
          const instance = window.bootstrap.Modal.getInstance(el);
          if (instance) instance.hide();
          return;
        }
        el.classList.remove('show');
        el.style.display = 'none';
        el.setAttribute('aria-hidden', 'true');
        el.removeAttribute('aria-modal');
        document.body.classList.remove('modal-open');
        if (modalBackdrop) {
          modalBackdrop.remove();
          modalBackdrop = null;
        }
      }

      function hideOpenModal() {
        document.querySelectorAll('.modal.show').forEach(function(el) {
          hideModal(el);
        });
      }

      document.addEventListener('click', function(e) {
        const modalToggle = e.target.closest('[data-bs-toggle="modal"]');
        if (modalToggle) {
          const targetSelector = modalToggle.getAttribute('data-bs-target');
          const target = targetSelector ? document.querySelector(targetSelector) : null;
          if (target && !(window.bootstrap && window.bootstrap.Modal)) {
            e.preventDefault();
            showModal(target);
          }
          return;
        }

        const collapseToggle = e.target.closest('[data-bs-toggle="collapse"]');
        if (collapseToggle) {
          const targetSelector = collapseToggle.getAttribute('data-bs-target');
          const target = targetSelector ? document.querySelector(targetSelector) : null;
          if (target && !(window.bootstrap && window.bootstrap.Collapse)) {
            e.preventDefault();
            target.classList.toggle('show');
          }
          return;
        }

        const dismiss = e.target.closest('[data-bs-dismiss="modal"]');
        if (dismiss) {
          e.preventDefault();
          hideModal(dismiss.closest('.modal'));
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          hideOpenModal();
        }
      });

      const confirmModalEl = document.getElementById('confirm-action-modal');
      const confirmTitle = document.getElementById('confirm-action-title');
      const confirmSummary = document.getElementById('confirm-action-summary');
      const confirmMessage = document.getElementById('confirm-action-message');
      const confirmSubmit = document.getElementById('confirm-action-submit');
      const confirmIcon = document.getElementById('confirm-action-icon');
      let pendingConfirmForm = null;
      let pendingConfirmSubmitter = null;

      function setConfirmVariant(variant) {
        if (!confirmSubmit || !confirmIcon) return;
        confirmSubmit.className = 'btn';
        confirmIcon.className = 'avatar avatar-md flex-shrink-0';

        if (variant === 'warning') {
          confirmSubmit.classList.add('btn-warning');
          confirmIcon.classList.add('bg-yellow-lt', 'text-yellow');
        } else if (variant === 'success') {
          confirmSubmit.classList.add('btn-success');
          confirmIcon.classList.add('bg-green-lt', 'text-green');
        } else {
          confirmSubmit.classList.add('btn-danger');
          confirmIcon.classList.add('bg-red-lt', 'text-red');
        }
      }

      document.querySelectorAll('form').forEach(function(form) {
        form.addEventListener('submit', function(e) {
          if (form.dataset.confirmBypass === '1') {
            delete form.dataset.confirmBypass;
            return;
          }
          const submitter = e.submitter || document.activeElement;
          const source = submitter && submitter.dataset && submitter.dataset.confirm ? submitter : form;
          const message = source.getAttribute('data-confirm');
          if (!message) return;

          e.preventDefault();
          pendingConfirmForm = form;
          pendingConfirmSubmitter = submitter && submitter.form === form ? submitter : null;

          if (confirmTitle) confirmTitle.textContent = source.dataset.confirmTitle || 'Confirm action';
          if (confirmSummary) confirmSummary.textContent = source.dataset.confirmSummary || 'This action changes stored data.';
          if (confirmMessage) confirmMessage.textContent = message;
          if (confirmSubmit) confirmSubmit.textContent = source.dataset.confirmAction || 'Confirm';
          setConfirmVariant(source.dataset.confirmVariant || 'danger');

          showModal(confirmModalEl);
        });
      });

      if (confirmSubmit) {
        confirmSubmit.addEventListener('click', function() {
          if (!pendingConfirmForm) return;
          const form = pendingConfirmForm;
          const submitter = pendingConfirmSubmitter;
          pendingConfirmForm = null;
          pendingConfirmSubmitter = null;
          form.dataset.confirmBypass = '1';
          hideModal(confirmModalEl);
          if (submitter && typeof form.requestSubmit === 'function') {
            form.requestSubmit(submitter);
          } else {
            form.submit();
          }
        });
      }
    });
  </script>
</body>
</html>
