<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Federated Onboarding - {{ admin_page_title() }}</title>
  <link href="/admin/ui/static/css/tabler.min.css" rel="stylesheet">
  <link href="/admin/ui/static/css/tabler-icons.min.css" rel="stylesheet">
  <script>
    (function () {
      const t = localStorage.getItem('theme') || 'auto';
      if (t === 'auto') {
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      } else {
        document.documentElement.setAttribute('data-bs-theme', t);
      }
    })();
  </script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="container container-tight py-4">
    <div class="card card-md">
      <div class="card-body text-center">
        <div class="avatar avatar-lg bg-green-lt text-green mb-3">
          <i class="ti ti-circle-check"></i>
        </div>
        <h2 class="h2 mb-2">{{ admin_page_title() }} Federated Onboarding</h2>
        <p class="text-secondary mb-4">{{ message }}</p>
        <div class="alert alert-success mb-0">
          You can close this window now.
        </div>
      </div>
    </div>
  </div>
</body>
</html>
