[package]
name = "simple-idm-server"
version = "0.9.6"
edition = "2024"

[[bin]]
name = "simple-idm-server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tower_governor = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

# JWT & Crypto
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
argon2 = "0.5"
uuid = { version = "1.23", features = ["v4", "serde"] }
rand = "0.10"
sha2 = "0.11"
base64 = "0.22"
rsa = { version = "0.9", features = ["pem"] }
clap = { version = "4.6", features = ["derive"] }
tabled = "0.20"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Config & Env
dotenvy = "0.15"
config = "0.15"
toml = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Validation
validator = { version = "0.20", features = ["derive"] }
regex = "1.12"
tempfile = "3.27"

# HTTP client (for OIDC discovery)
reqwest = { version = "0.13", features = ["json", "form"] }

# OIDC client
openidconnect = "4.0"

# In-memory storage
dashmap = "6.1"
url = "2.5"
dirs = "6.0"
urlencoding = "2.1"
qrcode = "0.14"
open = "5.3"
simple-idm-common = { path = "../simple-idm-common" }
simple-idm-ad-auth = { path = "../simple-idm-ad-auth" }
simple-idm-core = { path = "../simple-idm-core" }
askama = "0.15"
csv = "1.4"
