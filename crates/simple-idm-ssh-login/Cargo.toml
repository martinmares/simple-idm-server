[package]
name = "simple-idm-ssh-login"
version = "0.10.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "simple-idm-ssh-login"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
simple-idm-core = { path = "../simple-idm-core" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
