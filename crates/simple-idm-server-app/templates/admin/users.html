{% extends "admin/base.html" %}
{% block content %}
<div class="card mb-3">
  <div class="card-header"><h3 class="card-title">Create user</h3></div>
  <div class="card-body">
    <form method="post" action="/admin/ui/users/create" class="row g-2">
      <div class="col-md-3"><input class="form-control" name="username" placeholder="username" required></div>
      <div class="col-md-3"><input class="form-control" name="email" type="email" placeholder="email" required></div>
      <div class="col-md-3"><input class="form-control" name="password" type="password" placeholder="password" required></div>
      <div class="col-md-2 form-check mt-2"><input class="form-check-input" name="is_active" type="checkbox" checked> <label class="form-check-label">active</label></div>
      <div class="col-md-1"><button class="btn btn-primary w-100" type="submit">Create</button></div>
    </form>
  </div>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-vcenter card-table">
      <thead><tr><th>Username</th><th>Email</th><th>Active</th><th>Actions</th></tr></thead>
      <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ r.username }}</td>
        <td>{{ r.email }}</td>
        <td>{% if r.is_active %}yes{% else %}no{% endif %}</td>
        <td>
          <form method="post" action="/admin/ui/users/{{ r.id }}/update" class="d-flex gap-2 mb-1">
            <input class="form-control form-control-sm" type="email" name="email" value="{{ r.email }}" required>
            <label class="form-check form-switch mt-1">
              <input class="form-check-input" type="checkbox" name="is_active" {% if r.is_active %}checked{% endif %}>
            </label>
            <button class="btn btn-sm btn-outline-primary" type="submit">Save</button>
          </form>
          <form method="post" action="/admin/ui/users/{{ r.id }}/deactivate" onsubmit="return confirm('Deactivate user {{ r.username }}?');">
            <button class="btn btn-sm btn-outline-danger" type="submit">Safe delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
