{% extends "admin/base.html" %}
{% block content %}
<div class="card">
  <div class="card-header"><h3 class="card-title">Group → users</h3></div>
  <div class="table-responsive">
    <table class="table table-vcenter card-table">
      <thead><tr><th>Group</th><th>Users</th></tr></thead>
      <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ r.group_name }}</td>
        <td>{{ r.users }}</td>
      </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
