{% extends "admin/base.html" %}
{% block content %}
<div class="card mb-3">
  <div class="card-header"><h3 class="card-title">Create claim map</h3></div>
  <div class="card-body">
    <form method="post" action="/admin/ui/client-claims/create" class="row g-2">
      <div class="col-md-3">
        <select class="form-select" name="client_id" required>
          <option value="">Select client</option>
          {% for c in clients %}
          <option value="{{ c.0 }}">{{ c.1 }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select" name="group_id">
          <option value="">Any group (*)</option>
          {% for g in groups %}
          <option value="{{ g.0 }}">{{ g.1 }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-2"><input class="form-control" name="claim_name" placeholder="claim_name" required></div>
      <div class="col-md-2"><input class="form-control" name="claim_value" placeholder="value or a,b,c" required></div>
      <div class="col-md-1">
        <select class="form-select" name="claim_value_kind">
          <option value="single">single</option>
          <option value="array">array</option>
        </select>
      </div>
      <div class="col-md-12"><button class="btn btn-primary" type="submit">Create</button></div>
    </form>
  </div>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-vcenter card-table">
      <thead><tr><th>Client</th><th>Claim maps</th></tr></thead>
      <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ r.client_name }}</td>
        <td>{{ r.claims }}</td>
      </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
