[package]
name = "simple-idm-ssh-signer"
version = "0.3.5"
edition = "2024"

[[bin]]
name = "simple-idm-ssh-signer"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
dotenvy = "0.15"
simple-idm-core = { path = "../simple-idm-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
