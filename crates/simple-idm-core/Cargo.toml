[package]
name = "simple-idm-core"
version.workspace = true
edition = "2024"
license.workspace = true
authors = ["Martin Mareš <martin.mares@seznam.cz>"]
autobins = false

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
tower_governor = "0.8"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "sqlite", "uuid", "chrono", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

# JWT & Crypto
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
argon2 = "0.6"
uuid = { version = "1.27", features = ["v4", "serde"] }
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"
rsa = { version = "0.9", features = ["pem"] }
clap = { version = "4.6", features = ["derive"] }
tabled = "0.22"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Config & Env
dotenvy = "0.15"
config = "0.15"
toml = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Validation
validator = { version = "0.21", features = ["derive"] }
regex = "1.13"
tempfile = "3.27"

# HTTP client (for OIDC discovery)
reqwest = { version = "0.13", features = ["json", "form"] }

# OIDC client
openidconnect = "4.0"

# In-memory storage
dashmap = "6.2"
url = "2.5"
dirs = "7.0"
urlencoding = "2.1"
qrcode = "0.14"
qr_code = { version = "2.0.0", default-features = false }
open = "5.4"
chacha20poly1305 = "0.11"
totp-rs = { version = "6.0", features = ["gen_secret", "otpauth", "zeroize"] }
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
simple-idm-common = { path = "../simple-idm-common" }
simple-idm-ad-auth = { path = "../simple-idm-ad-auth" }
simple-idm-ldap-sync = { path = "../simple-idm-ldap-sync" }

[target.'cfg(any(all(target_os = "linux", target_env = "musl"), target_os = "macos", target_env = "msvc"))'.dependencies]
# Statically link OpenSSL into portable release binaries on MUSL, macOS and MSVC.
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.13", features = ["json", "form", "cookies"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
base64 = "0.23"
