[package]
name = "simple-idm-ad-proxy"
version = "0.10.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "simple-idm-ad-proxy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dashmap = "6.2"
rand = "0.10"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simple-idm-ad-auth = { path = "../simple-idm-ad-auth" }
simple-idm-common = { path = "../simple-idm-common" }
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"

[build-dependencies]
