[workspace]
members = [
    "crates/simple-idm-core",
    "crates/simple-idm-common",
    "crates/simple-idm-ad-auth",
    "crates/simple-idm-ldap-sync",
    "crates/simple-idm-server",
    "crates/simple-idm-ctl",
    "crates/simple-idm-oauth2-proxy",
    "crates/simple-idm-oidc-metadata-proxy",
    "crates/simple-idm-token-proxy",
    "crates/simple-idm-ad-proxy",
    "crates/simple-idm-ssh-login",
    "crates/simple-idm-ssh-signer",
    "crates/simple-idm-bastion",
]
resolver = "2"

[workspace.package]
version = "0.13.0"
license = "MIT"

[profile.release]
strip = "symbols"
