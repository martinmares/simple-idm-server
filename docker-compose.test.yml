# Disposable developer-only database; never uses the development data volume.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simple_idm_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simple_idm_test"]
      interval: 1s
      timeout: 5s
      retries: 30
