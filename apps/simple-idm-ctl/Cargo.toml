[package]
name = "simple-idm-ctl-app"
version = "0.3.5"
edition = "2024"

[[bin]]
name = "simple-idm-ctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
open = "5.3"
openidconnect = "4.0"
qrcode = "0.14"
rand = "0.10"
ratatui = "0.30"
reqwest = { version = "0.13", features = ["json", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
simple-idm-common = { path = "../../crates/simple-idm-common" }
tabled = "0.20"
tokio = { version = "1", features = ["full"] }
tui-input = "0.15"
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.21", features = ["v4", "serde"] }
